volumes:
    mongo-data:
        external: true
    redis-data:
        external: true

services:
    gateway:
        container_name: gateway
        image: krakend:2.10
        restart: always
        volumes:
            # The image's default command is `krakend run -c krakend.json` from
            # WORKDIR /etc/krakend, so the config has to land on this exact path.
            - ./krakend.prod.json:/etc/krakend/krakend.json:ro
            # Uncomment together with the "tls" block in krakend.prod.json if
            # KrakenD should terminate TLS itself instead of sitting behind an LB.
            # - /etc/letsencrypt:/etc/letsencrypt:ro
        networks:
            - olympsis
        ports:
            # Same host port apisix used, so whatever fronts this needs no change.
            - 9080:8080
        depends_on:
            - server
            - storage
            - invite-service
            - notif-service

    server:
        container_name: server
        # Published by .github/workflows/release.yml on every `v*` tag push.
        # Bump this per release; `:latest` also tracks the newest stable build
        # if you would rather not pin. Note the registry moved region
        # (us-central1 -> northamerica-northeast1) and dropped the `/release`
        # sub-path, so nothing published before v0.8.1 exists at this address.
        # (v0.8.0 was tagged but never published — its run failed before the
        # image push, so that version does not exist in the registry.)
        image: northamerica-northeast1-docker.pkg.dev/olympsis-485522/docker-images/server:v0.8.1
        restart: always
        pull_policy: always
        ports:
            - 8080:80
        networks:
            - olympsis
        volumes:
            - ./AuthKey_PWK5QB5Z6R.p8:/app/AuthKey_PWK5QB5Z6R.p8:ro
            - ./firebase-credentials.json:/app/firebase-credentials.json:ro
        env_file: .env.prod
        environment:
            # In-network address for invite-service's gRPC listener. Overrides
            # the localhost:9082 in .env.prod, which from inside this container
            # resolves to the server itself, so the invite client never reached
            # invite-service at all (check-in silently returns no invites).
            INVITE_GRPC_ADDR: invite-service:9082
            # .env.prod carries no RabbitMQ settings at all, and the bus treats
            # a blank URL as "publishing disabled" — so the server has been
            # publishing no events, while invite-service and notif-service
            # consume from that exchange. Same required variable those two use,
            # so one .env value wires all three to the same broker.
            RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in the .env beside compose.yaml}
            RABBITMQ_EXCHANGE: olympsis.events
        depends_on:
            - invite-service

    storage:
        container_name: storage
        image: us-central1-docker.pkg.dev/olympsis-485522/storage/release:v0.3.0
        restart: always
        pull_policy: always
        ports:
            - 8081:80
        networks:
            - olympsis
        volumes:
            - ./firebase-credentials.json:/app/firebase-credentials.json:ro
            - ./storage-credentials.json:/app/storage-credentials.json:ro
        env_file: .env.prod

    mongo:
        container_name: mongo
        image: mongo
        restart: always
        networks:
            - olympsis
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: olympsis
        ports:
            - 27017:27017
        volumes:
            - mongo-data:/data/db

    redis:
        container_name: redis
        image: redis
        restart: always
        networks:
            - olympsis
        ports:
            - 6379:6379
        volumes:
            - redis-data:/data

    invite-service:
        container_name: invite-service
        # Published by the invite-service repo's release workflow on `v*` tags.
        image: northamerica-northeast1-docker.pkg.dev/olympsis-485522/docker-images/invite-service:v0.1.0
        restart: always
        pull_policy: always
        networks:
            - olympsis
        # No host ports published on purpose: the only callers are the gateway
        # (HTTP) and the server (gRPC), both in-network. Publishing 8082 would
        # also collide with the pm2-managed instance until that one is stopped.
        extra_hosts:
            # RabbitMQ still runs on the host under pm2, not in this stack.
            - "host.docker.internal:host-gateway"
        volumes:
            - ./firebase-credentials.json:/app/firebase-credentials.json:ro
        # env_file carries the shared secrets (MODE, Apple keys). `environment`
        # then overrides the names this service uses, which differ from the
        # server's — MONGO_URI here vs MONGO_ADDRESS there — and so must win
        # over the server-shaped values inherited from the same file.
        env_file: .env.prod
        environment:
            PORT: "8082"
            GRPC_PORT: "9082"
            MONGO_DB: olympsis
            # Same in-stack mongo and root credentials declared for the mongo
            # service below; this service reads MONGO_URI, not MONGO_ADDRESS.
            MONGO_URI: mongodb://admin:olympsis@mongo:27017
            # Required, no default: the host broker's real credentials are not
            # guessable, and a wrong URL would fail open as "no events" rather
            # than erroring. Set it in the .env next to this file.
            RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in the .env beside compose.yaml}
            RABBITMQ_EXCHANGE: olympsis.events
            SERVER_GRPC_ADDR: server:50051
            FIREBASE_FILE_PATH: /app/firebase-credentials.json
        # Waits for mongo to accept connections, not merely to start. Both
        # services abandon the event bus permanently if their first broker
        # connect fails, so a slow dependency at boot leaves them running
        # silently degraded rather than crashing.
        depends_on:
            mongo:
                condition: service_healthy

    notif-service:
        container_name: notif-service
        # Published by the notif-service repo's release workflow on `v*` tags.
        image: northamerica-northeast1-docker.pkg.dev/olympsis-485522/docker-images/notif-service:v0.1.0
        restart: always
        pull_policy: always
        networks:
            - olympsis
        # See invite-service: reached only in-network, and 8083 would collide
        # with the pm2-managed instance.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./firebase-credentials.json:/app/firebase-credentials.json:ro
            - ./AuthKey_PWK5QB5Z6R.p8:/app/AuthKey_PWK5QB5Z6R.p8:ro
        env_file: .env.prod
        environment:
            PORT: "8083"
            GRPC_PORT: "9083"
            MONGO_DB: olympsis
            # Same in-stack mongo and root credentials declared for the mongo
            # service below; this service reads MONGO_URI, not MONGO_ADDRESS.
            MONGO_URI: mongodb://admin:olympsis@mongo:27017
            # Required, no default — see invite-service.
            RABBITMQ_URL: ${RABBITMQ_URL:?set RABBITMQ_URL in the .env beside compose.yaml}
            RABBITMQ_EXCHANGE: olympsis.events
            FIREBASE_FILE_PATH: /app/firebase-credentials.json
            # APPLE_KEY_ID / APPLE_TEAM_ID come from .env.prod — the same APNs
            # key the server uses.
            APNS_FILE_PATH: /app/AuthKey_PWK5QB5Z6R.p8
        # Waits for mongo to accept connections, not merely to start. Both
        # services abandon the event bus permanently if their first broker
        # connect fails, so a slow dependency at boot leaves them running
        # silently degraded rather than crashing.
        depends_on:
            mongo:
                condition: service_healthy

networks:
    olympsis:
        driver: bridge