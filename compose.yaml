version: "3.0"

volumes:
    mongo-data:
        external: true
    redis-data:
        external: true

services:
    gateway:
        container_name: gateway
        image: krakend:2.10
        restart: always
        volumes:
            # The image's default command is `krakend run -c krakend.json` from
            # WORKDIR /etc/krakend, so the config has to land on this exact path.
            - ./krakend.prod.json:/etc/krakend/krakend.json:ro
            # Uncomment together with the "tls" block in krakend.prod.json if
            # KrakenD should terminate TLS itself instead of sitting behind an LB.
            # - /etc/letsencrypt:/etc/letsencrypt:ro
        networks:
            - olympsis
        ports:
            # Same host port apisix used, so whatever fronts this needs no change.
            - 9080:8080
        extra_hosts:
            # invite-service and notif-service run on the host under pm2, not in
            # this stack, so the gateway reaches them via the host gateway IP.
            - "host.docker.internal:host-gateway"
        depends_on:
            - server
            - storage

    server:
        container_name: server
        # Published by .github/workflows/release.yml on every `v*` tag push.
        # Bump this per release; `:latest` also tracks the newest stable build
        # if you would rather not pin. Note the registry moved region
        # (us-central1 -> northamerica-northeast1) and dropped the `/release`
        # sub-path, so nothing published before v0.8.0 exists at this address.
        image: northamerica-northeast1-docker.pkg.dev/olympsis-485522/server:v0.8.0
        restart: always
        pull_policy: always
        ports:
            - 8080:80
        networks:
            - olympsis
        volumes:
            - ./AuthKey_PWK5QB5Z6R.p8:/app/AuthKey_PWK5QB5Z6R.p8:ro
            - ./firebase-credentials.json:/app/firebase-credentials.json:ro
        env_file: .env.prod

    storage:
        container_name: storage
        image: us-central1-docker.pkg.dev/olympsis-485522/storage/release:v0.3.0
        restart: always
        pull_policy: always
        ports:
            - 8081:80
        networks:
            - olympsis
        volumes:
            - ./firebase-credentials.json:/app/firebase-credentials.json:ro
            - ./storage-credentials.json:/app/storage-credentials.json:ro
        env_file: .env.prod

    mongo:
        container_name: mongo
        image: mongo
        restart: always
        networks:
            - olympsis
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: olympsis
        ports:
            - 27017:27017
        volumes:
            - mongo-data:/data/db

    redis:
        container_name: redis
        image: redis
        restart: always
        networks:
            - olympsis
        ports:
            - 6379:6379
        volumes:
            - redis-data:/data

networks:
    olympsis:
        driver: bridge