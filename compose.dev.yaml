name: olympsis-dev

volumes:
    mongo-data:
    redis-data:
    rabbitmq-data:

secrets:
    key-file:
        file: ./files/localhost.key
    cert-file:
        file: ./files/localhost.crt
    apns-key:
        file: ./files/AuthKey_5PR7XV2XXL.p8
    firebase-token:
        file: ./files/firebase-credentials.json
    apple_key_id:
        environment: APPLE_KEY_ID
    apple_team_id:
        environment: APPLE_TEAM_ID
    mapkit_token:
        environment: MAPKIT_TOKEN
    # Artifact Registry token for the invite/notif image builds. Unlike the
    # server, those modules have no `replace => ../models`, so models can only
    # come from AR and the build needs credentials. `make dev-netrc` writes this
    # from gcloud; `make dev-up` regenerates it first because the token is
    # short-lived. Mounted as a BuildKit secret, so it never lands in a layer.
    netrc:
        file: ./files/netrc

services:
    gateway:
        container_name: gateway
        image: krakend:2.10
        restart: always
        volumes:
            # The image's default command is `krakend run -c krakend.json` from
            # WORKDIR /etc/krakend, so the config has to land on this exact path.
            - ./files/krakend.dev.json:/etc/krakend/krakend.json:ro
        ports:
            # Published on :80 because the iOS dev client resolves apiHost to a
            # bare "localhost" with no port. The server moved to :8080 to free it.
            - 80:8080
        depends_on:
            - server
            - invite-service
            - notif-service
    server:
        build:
            context: .
            # DEV ONLY: expose the local models module (referenced by the
            # `replace => ../models` in go.mod) as a named build context so the
            # Dockerfile can copy it into the image. Remove alongside the replace
            # directive when cutting a production build.
            additional_contexts:
                models: ../models
            no_cache: true
        container_name: server
        restart: always
        ports:
            # Direct access to the server, bypassing the gateway. The gateway
            # owns :80 now; this stays published so curl/seed scripts can hit a
            # handler without a matching KrakenD endpoint declaration.
            - 8080:80
            # Internal gRPC (EventTeamService). invite-service now reaches this
            # in-network as server:50051; the publish stays for grpcurl and for
            # running invite-service on the host with `make run` instead.
            - 50051:50051
        volumes:
            - ./files/firebase-credentials.json:/app/firebase-credentials.json:ro
            - ./files/storage-credentials.json:/app/storage-credentials.json:ro
            - ./files/localhost.key:/app/localhost.key:ro
            - ./files/localhost.crt:/app/localhost.crt:ro
            - ./files/AuthKey_5PR7XV2XXL.p8:/app/AuthKey_5PR7XV2XXL.p8:ro
            - ./files/AuthKey_FQ38XX3HXG.p8:/app/AuthKey_FQ38XX3HXG.p8:ro
        env_file: .env.dev
        environment:
            # invite-service is in this stack now, so reach it by service name.
            # .env.dev still says host.docker.internal:9082, which was correct
            # only while it ran on the host under `make run`.
            INVITE_GRPC_ADDR: invite-service:9082
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_started

    # Both services build from their sibling checkouts so local edits land in
    # the dev stack, matching how `server` is built above. Their ports stay
    # published for direct curl/grpcurl — which also means `make run` copies on
    # the host must be stopped first, or the bind fails.
    invite-service:
        build:
            context: ../invite-service
            secrets:
                - netrc
            args:
                GOPROXY: https://northamerica-northeast1-go.pkg.dev/olympsis-485522/go-modules,https://proxy.golang.org,direct
                GONOSUMDB: github.com/olympsis/*
        container_name: invite-service
        restart: always
        ports:
            - 8082:8082
            - 9082:9082
        volumes:
            - ./files/firebase-credentials.json:/app/firebase-credentials.json:ro
        # env_file gives MODE=DEVELOPMENT and the in-stack RABBITMQ_URL;
        # `environment` supplies the names this service uses that differ from
        # the server's (MONGO_URI vs MONGO_ADDRESS) and so must win.
        env_file: .env.dev
        environment:
            PORT: "8082"
            GRPC_PORT: "9082"
            MONGO_URI: mongodb://admin:olympsis@mongo:27017
            MONGO_DB: olympsis
            SERVER_GRPC_ADDR: server:50051
            FIREBASE_FILE_PATH: /app/firebase-credentials.json
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    notif-service:
        build:
            context: ../notif-service
            secrets:
                - netrc
            args:
                GOPROXY: https://northamerica-northeast1-go.pkg.dev/olympsis-485522/go-modules,https://proxy.golang.org,direct
                GONOSUMDB: github.com/olympsis/*
        container_name: notif-service
        restart: always
        ports:
            - 8083:8083
            - 9083:9083
        volumes:
            - ./files/firebase-credentials.json:/app/firebase-credentials.json:ro
            - ./files/AuthKey_5PR7XV2XXL.p8:/app/AuthKey_5PR7XV2XXL.p8:ro
        env_file: .env.dev
        environment:
            PORT: "8083"
            GRPC_PORT: "9083"
            MONGO_URI: mongodb://admin:olympsis@mongo:27017
            MONGO_DB: olympsis
            FIREBASE_FILE_PATH: /app/firebase-credentials.json
            APNS_FILE_PATH: /app/AuthKey_5PR7XV2XXL.p8
        depends_on:
            mongo:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    mongo:
        container_name: mongo
        image: mongo
        restart: always
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: olympsis
        ports:
            - 27017:27017
        volumes:
            - mongo-data:/data/db

    redis:
        container_name: redis
        image: redis
        restart: always
        ports:
            - 6379:6379
        volumes:
            - redis-data:/data

    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq:3-management-alpine
        restart: always
        # Dependents wait on this rather than on the container merely starting.
        # The broker takes several seconds to accept AMQP, and both services
        # give up on the bus PERMANENTLY if their first connect fails — they
        # set their publisher to nil and never retry, so they would come up
        # silently consuming nothing. The server survives it (it reconnects in
        # the background) but logs errors on the way.
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            interval: 5s
            timeout: 10s
            retries: 12
            start_period: 20s
        environment:
            # Dedicated user — the default guest account is refused over the
            # published port since it's restricted to loopback connections.
            RABBITMQ_DEFAULT_USER: olympsis
            RABBITMQ_DEFAULT_PASS: olympsis
        ports:
            - 5672:5672    # AMQP (services connect here)
            - 15672:15672  # management UI (http://localhost:15672)
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq